site_name: 철강 기술 인텔리전스
site_description: 해외 경쟁사 철강 신기술 근거 기반 LLM Wiki
docs_dir: ../../steel-wiki
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tooltips

plugins:
  - material/meta
  - search:
      lang:
        - ko
        - en
  - enumerate-headings:
      start_level: 2
      increment_across_pages: false
      toc_depth: 3

hooks:
  - mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-theme.js
  - javascripts/mermaid-contrast.js
  - javascripts/mermaid-viewer.js
  - javascripts/footnote-tooltips.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

exclude_docs: |
  .system/
  config/
  reports/audits/
  AGENTS.md
  log.md

not_in_nav: |
  sources/

copyright: 근거 기반 철강 기술 인텔리전스 · POSCO Blue theme
